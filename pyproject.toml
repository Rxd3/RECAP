[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recap-nlp"
version = "0.0.1"
description = "RECAP: Restoring English Casing and Punctuation with sequence labeling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "sklearn-crfsuite==0.5.0", "python-crfsuite==0.9.12", "joblib>=1.3"]

[project.urls]
Repository = "https://github.com/Rxd3/RECAP"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
